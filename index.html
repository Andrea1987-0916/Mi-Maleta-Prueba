@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap');
:root{--cream:#f3ead8;--card:#fbf6ea;--sage:#587a56;--sage-light:#dce5d7;--ink:#3a3a2c;--muted:#8a846f;--line:#e4dac6;--rose:#9b5364;--white:#fffdf8;--shadow:0 5px 18px #544a3210}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--cream);color:var(--ink);font-family:Nunito,system-ui,sans-serif}body{padding-bottom:92px}.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--cream);position:relative}.hero{width:100%;display:block;aspect-ratio:1.18;object-fit:cover;object-position:center;border-radius:0 0 24px 24px}.brand{text-align:center;padding:14px 22px 18px}.brand h1{font:700 48px/1 'Cormorant Garamond',serif;color:var(--rose);margin:0}.brand p{font:italic 25px/1.25 'Cormorant Garamond',serif;color:var(--muted);margin:8px 0 0}.eyebrow{text-transform:uppercase;letter-spacing:.15em;font-size:11px;color:var(--muted);font-weight:800}.page{padding:16px 18px 26px}.page-head{display:flex;align-items:center;gap:12px;margin:2px 0 18px}.back{border:0;background:var(--white);width:42px;height:42px;border-radius:50%;font-size:22px;color:var(--sage);box-shadow:var(--shadow)}h2{font:700 34px/1.05 'Cormorant Garamond',serif;color:var(--sage);margin:0}h3{font-size:18px;margin:0 0 10px}p{line-height:1.45}.sub{color:var(--muted);font-size:14px;margin:5px 0 0}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}.card-title{display:flex;align-items:center;justify-content:space-between;gap:10px}.btn{border:0;border-radius:16px;padding:12px 16px;font:800 14px Nunito,sans-serif;background:var(--sage);color:white;cursor:pointer;min-height:44px}.btn.secondary{background:var(--sage-light);color:var(--sage)}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--sage)}.btn.danger{background:#f4e2e1;color:#934b4b}.btn.small{min-height:36px;padding:8px 12px;font-size:12px;border-radius:12px}.btn.full{width:100%}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{font-weight:800;font-size:13px;color:#5d5c50}.field input,.field select,.field textarea,.search{font:600 15px Nunito,sans-serif;color:var(--ink);background:var(--white);border:1px solid var(--line);border-radius:15px;padding:13px;width:100%;min-height:48px;outline-color:var(--sage)}.field textarea{min-height:90px;resize:vertical}.search{margin:0 0 14px}.trip-card{display:grid;grid-template-columns:86px 1fr;gap:14px;align-items:center}.trip-art{width:86px;height:100px;border-radius:17px;background:var(--sage-light);display:flex;align-items:center;justify-content:center;font-size:38px;overflow:hidden}.trip-art img{width:100%;height:100%;object-fit:cover}.trip-card h3{margin:0 0 4px}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#e7eadb;color:var(--sage);font-size:11px;font-weight:800}.progress{height:8px;background:#e6decc;border-radius:99px;overflow:hidden;margin-top:10px}.progress span{display:block;height:100%;background:var(--sage);border-radius:99px;transition:width .2s}.rowline{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #e9e0cf}.rowline:last-child{border-bottom:0}.rowline .grow{flex:1;min-width:0}.rowline strong{display:block;font-size:14px}.rowline small{color:var(--muted)}.check{width:24px;height:24px;accent-color:var(--sage);flex-shrink:0}.cat-icon{width:48px;height:48px;border-radius:16px;background:#e8eadb;display:grid;place-items:center;font-size:23px;flex-shrink:0}.cat-row{display:flex;gap:12px;align-items:center}.cat-row .grow{flex:1}.cat-row h3{margin:0;font-size:16px}.cat-row p{margin:3px 0 0;color:var(--muted);font-size:12px}.empty{text-align:center;padding:28px 12px;color:var(--muted)}.empty .big{font-size:42px;margin-bottom:8px}.bottom-nav{position:fixed;z-index:5;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);display:gri .watercolor-art{width:66px;height:66px;flex:0 0 66px;display:flex;align-items:center;justify-content:center;border-radius:19px;background:linear-gradient(145deg,#fbf5e9,#f0e6d6);box-shadow:inset 0 0 0 1px #e8deca;overflow:hidden}.watercolor-art svg{width:100%;height:100%;filter:saturate(.82)}.category-list .watercolor-art{margin-right:3px}.item-line{gap:8px}.item-line .item-art{width:48px;height:48px;flex:0 0 48px;border-radius:14px}.item-line .grow{min-width:0}.item-line .btn{padding:7px 9px}.progress-cat-title{display:flex;align-items:center;gap:10px}.progress-cat-title .watercolor-art{width:44px;height:44px;flex-basis:44px;border-radius:13px}.cat-row{gap:12px}

ft.travelers||db.settings.names)[0]||'André')}" placeholder="Primer viajero"><input name="traveler2" aria-label="Segundo viajero" value="${esc((draft.travelers||db.settings.names)[1]||'Yosef')}" placeholder="Segundo viajero"></div></div><div class="field"><label for="tripNotes">Notas del viaje (opcional)</label><textarea id="tripNotes" name="notes" placeholder="Reservas, ideas o recordatorios">${esc(draft.notes||'')}</textarea></div><div class="actions"><button class="btn full" type="submit">${editingTrip?'Guardar cambios':'Crear viaje y preparar equipaje'}</button><button class="btn ghost full" type="button" data-action="back" data-target="trips">Cancelar</button></div></form></div>`;

else if(screen==='category'){let t=currentTrip(),cat=t?.categories.find(c=>c.id===activeCategory);if(!cat){screen='categories';return render()}let items=cat.items.filter(i=>db.settings.showCompleted||!i.done);app.innerHTML=`<div class="page">${header(cat.category,t.name,'categories')}<div class="card-title" style="margin-bottom:12px"><p class="sub">Marca cada artículo a medida que lo empacas.</p><button class="btn small" data-action="add-trip-item">＋ Artículo</button></div><div class="card">${items.length?items.map(itemRow).join(''):`<div class="empty">No hay artículos pendientes en esta categoría.</div>`}</div><button class="btn secondary full" data-action="edit-category">Editar categoría</button></div>`}

function itemRow(i){return `<div class="rowline item-line"><input class="check" type="checkbox" data-action="toggle-item" data-id="${i.id}" ${i.done?'checked':''} aria-label="Marcar ${esc(i.name)}">${itemIllustration(i.name,i.category)}<div class="grow" data-action="item-detail" data-id="${i.id}" style="cursor:pointer"><strong style="${i.done?'text-decoration:line-through;color:var(--muted)':''}">${esc(i.name)}</strong><small>Cantidad: ${Number(i.qty)||1}${i.note?' · '+esc(i.note):''}</small></div><button class="btn ghost small" data-action="item-detail" data-id="${i.id}">Editar</button></div>`}
function renderAllItems(t,q=''){let list=allItems(t).filter(i=>(!q||i.name.toLowerCase().includes(q.toLowerCase())||i.category.toLowerCase().includes(q.toLowerCase()))&&(db.settings.showCompleted||!i.done));return list.length?list.map(i=>itemRow(i)).join(''):`<div class="card empty">No hay artículos que coincidan.</div>`}
function renderMaster(q=''){return db.master.map(cat=>{let items=cat.items.filter(i=>!q||i.name.toLowerCase().includes(q.toLowerCase())||cat.category.toLowerCase().includes(q.toLowerCase())).filter(i=>db.settings.showCompleted||!i.done);if(!items.length)return '';return `<div class="card"><div class="card-title"><div class="cat-row">${categoryIllustration(cat.category)}<div><h3>${esc(cat.category)}</h3><p class="sub">${items.length} artículos</p></div></div><button class="btn ghost small" data-action="master-cat-menu" data-id="${cat.id}">•••</button></div>${items.map(i=>`<div class="rowline item-line"><input class="check" type="checkbox" data-action="toggle-master" data-id="${i.id}" ${i.done?'checked':''} aria-label="Marcar ${esc(i.name)}">${itemIllustration(i.name,cat.category)}<div class="grow" data-action="edit-master-item" data-id="${i.id}" style="cursor:pointer"><strong style="${i.done?'text-decoration:line-through;color:var(--muted)':''}">${esc(i.name)}</strong><small>Cantidad habitual: ${Number(i.qty)||1}</small></div><button class="btn ghost small" data-action="edit-master-item" data-id="${i.id}">Ver / editar</button></div>`).join('')}<button class="btn ghost small" style="margin-top:10px" data-action="add-master-item" data-id="${cat.id}">＋ Añadir a ${esc(cat.category)}</button></div>`}).join('')||`<div class="card empty">No encontramos artículos. Puedes añadir uno nuevo.</div>`}

else if(f.id==='itemForm'){let t=currentTrip(),cat=t?.categories.find(c=>c.id===activeCategory),it=cat?.items.find(i=>i.id===window.activeItem);if(it){let d=Object.fromEntries(new FormData(f).entries());it.name=d.name;it.qty=Math.max(1,Number(d.qty)||1);it.note=d.note||'';it.done=f.elements.done.checked;save();go('category');toast('Artículo actualizado')}}
else if(f.id==='genericItemForm'){let d=Object.fromEntries(new FormData(f).entries()),target=window.masterTarget;if(target?.item){Object.assign(target.item,{name:d.name,qty:Math.max(1,Number(d.qty)||1),note:d.note||''})}else{let cat=db.master.find(c=>c.id===target?.catId)||db.master[0];if(!cat){cat={id:uid(),category:'Otros',icon:'🧳',items:[]};db.master.push(cat)}cat.items.push({id:uid(),name:d.name,qty:Math.max(1,Number(d.qty)||1),note:d.note||'',done:false})}save();closeModal();render();toast('Lista maestra actualizada')}});
document.getElementById('app').addEventListener('input',e=>{if(e.target.id==='masterSearch'||e.target.id==='checkSearch'){query=e.target.value;let pos=e.target.selectionStart;let id=e.target.id,holder=document.getElementById(id==='masterSearch'?'masterList':'checkItems');if(holder){holder.innerHTML=id==='masterSearch'?renderMaster(query):renderAllItems(currentTrip(),query);let inp=document.getElementById(id);inp?.focus();inp?.setSelectionRange(pos,pos)}}});
document.getElementById('app').addEventListener('change',e=>{let el=e.target;if(el.matches('#showCompleted')){db.settings.showCompleted=el.checked;save();render()}else if(el.matches('[data-action="toggle-item"]')){let t=currentTrip();for(let c of t?.categories||[]){let i=c.items.find(i=>i.id===el.dataset.id);if(i){i.done=el.checked;break}}save();render()}else if(el.matches('[data-action="toggle-master"]')){for(let c of db.master){let i=c.items.find(i=>i.id===el.dataset.id);if(i){i.done=el.checked;break}}save();renderMasterInto()}});
function renderMasterInto(){let x=document.getElementById('masterList');if(x)x.innerHTML=renderMaster(query)}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id;
if(a==='back'){go(b.dataset.target||'trips')}
else if(a==='new-trip'){editingTrip=null;draft={name:'',destination:'',climate:'variable',start:'',end:'',type:'ciudad',travelers:[...db.settings.names],notes:''};go('newtrip')}
else if(a==='edit-trip'){let t=db.trips.find(t=>t.id===id);if(t){editingTrip=id;draft={...t,travelers:t.travelers||db.settings.names};go('newtrip');let s=document.getElementById('climate');if(s)s.value=t.climate||'variable';let ty=document.getElementById('type');if(ty)ty.value=t.type||'ciudad'}}
else if(a==='open-trip'){activeTrip=id;go('categories')}
else if(a==='trip-more'){let t=db.trips.find(t=>t.id===id);openModal('Opciones del viaje',`<p>${esc(t?.name)}</p><div class="actions"><button class="btn full" data-action="edit-trip" data-id="${id}">Editar viaje</button><button class="btn secondary full" data-action="duplicate-trip" data-id="${id}">Duplicar viaje</button><button class="btn danger full" data-action="delete-trip" data-id="${id}">Eliminar viaje</button></div>`)}
else if(a==='delete-trip'){if(confirm('¿Eliminar este viaje y su checklist?')){db.trips=db.trips.filter(t=>t.id!==id);if(activeTrip===id)activeTrip=null;save();closeModal();go('trips')}}
else if(a==='duplicate-trip'){let t=db.trips.find(t=>t.id===id);if(t){let n=JSON.parse(JSON.stringify(t));n.id=uid();n.name+=' (copia)';n.categories.forEach(c=>{c.id=uid();c.items.forEach(i=>{i.id=uid();i.done=false})});db.trips.unshift(n);save();closeModal();go('trips');toast('Viaje duplicado')}}
else if(a==='open-category'){activeCategory=id;go('category')}
else if(a==='progress'){go('progress')}
else if(a==='full-checklist'){go('checklist')}
else if(a==='go-trips'){go('trips')}
else if(a==='item-detail'){let t=currentTrip();for(let c of t?.categories||[]){if(c.items.some(i=>i.id===id)){activeCategory=c.id;window.activeItem=id;go('item');return}}}
else if(a==='delete-trip-item'){let t=currentTrip(),cat=t?.categories.find(c=>c.id===activeCategory);if(cat&&confirm('¿Eliminar este artículo del viaje?')){cat.items=cat.items.filter(i=>i.id!==id);save();go('category')}}
else if(a==='add-trip-item'){let t=currentTrip(),cat=t?.categories.find(c=>c.id===activeCategory);window.masterTarget={catId:null,item:null};openModal('Añadir artículo',formFieldsItem());document.getElementById('genericItemForm').id='tripAddItemForm';document.getElementById('tripAddItemForm').addEventListener('submit',ev=>{ev.preventDefault();let d=Object.fromEntries(new FormData(ev.target).entries());cat.items.push({id:uid(),name:d.name,qty:Math.max(1,Number(d.qty)||1),note:d.note||'',done:false});save();closeModal();render();toast('Artículo añadido al viaje')},{once:true})}
else if(a==='edit-category'){let t=currentTrip(),cat=t?.categories.find(c=>c.id===activeCategory);if(cat)openModal('Editar categoría',`<form id="catForm"><div class="field"><label>Nombre</label><input name="category" value="${esc(cat.category)}" required></div><div class="field"><label>Icono</label><input name="icon" value="${esc(cat.icon)}" maxlength="4"></div><div class="actions"><button class="btn full">Guardar</button><button type="button" class="btn danger full" data-action="delete-category" data-id="${cat.id}">Eliminar categoría</button></div></form>`)}
else if(a==='add-category'){openModal('Nueva categoría',`<form id="catForm"><div class="field"><label>Nombre</label><input name="category" required placeholder="Ej. Documentos"></div><div class="field"><label>Icono (opcional)</label><input name="icon" placeholder="🧳" maxlength="4"></div><button class="btn full">Crear categoría</button></form>`)}
else if(a==='delete-category'){let t=currentTrip();if(confirm('¿Eliminar esta categoría del viaje?')){t.categories=t.categories.filter(c=>c.id!==id);save();closeModal();go('categories')}}
else if(a==='add-master-category'){openModal('Nueva categoría',`<form id="masterCatForm"><div class="field"><label>Nombre de la categoría</label><input name="category" required></div><div class="field"><label>Icono</label><input name="icon" placeholder="🧳" maxlength="4"></div><button class="btn full">Crear categoría</button></form>`)}
else if(a==='master-cat-menu'){let c=db.master.find(c=>c.id===id);openModal('Categoría',`<p>${esc(c?.category)}</p><div class="actions"><button class="btn full" data-action="add-master-item" data-id="${id}">Añadir artículo</button><button class="btn secondary full" data-action="rename-master-category" data-id="${id}">Renombrar categoría</button><button class="btn danger full" data-action="delete-master-category" data-id="${id}">Eliminar categoría</button></div>`)}
else if(a==='rename-master-category'){let c=db.master.find(c=>c.id===id);openModal('Renombrar categoría',`<form id="renameCatForm"><div class="field"><label>Nombre</label><input name="category" value="${esc(c?.category)}" required></div><button class="btn full">Guardar</button></form>`);window.renameCat=id}
else if(a==='delete-master-category'){if(confirm('¿Eliminar esta categoría y sus artículos de la lista maestra?')){db.master=db.master.filter(c=>c.id!==id);save();closeModal();render()}}
else if(a==='add-master-item'){window.masterTarget={catId:id||null,item:null};openModal('Nuevo artículo',formFieldsItem({category:(db.master.find(c=>c.id===id)||{}).category||''}))}
else if(a==='edit-master-item'){let r=masterItemRef(id);if(r){window.masterTarget={catId:r.cat.id,item:r.item};openModal('Editar artículo',formFieldsItem({...r.item,category:r.cat.category}))}}
else if(a==='save-names'){db.settings.names=[document.getElementById('name1').value.trim()||'André',document.getElementById('name2').value.trim()||'Yosef'];save();toast('Nombres guardados');render()}
else if(a==='export'){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a1=document.createElement('a');a1.href=url;a1.download='mi-maleta-respaldo.json';a1.click();URL.revokeObjectURL(url);toast('Copia de seguridad preparada')}
else if(a==='import'){document.getElementById('importFile').click()}
else if(a==='reset'){if(confirm('¿Seguro? Se borrarán todos los viajes y cambios locales.')){db=initial();save();activeTrip=null;go('trips');toast('Datos reiniciados')}}
else if(a==='close-modal'){closeModal()}
});

document.getElementById('modal').addEventListener('input',e=>{if(e.target.name==='name'&&e.target.form?.id==='genericItemForm'){let p=e.target.form.querySelector('.item-preview');if(p){let r=window.masterTarget;let c=db.master.find(x=>x.id===r?.catId);p.innerHTML=itemIllustration(e.target.value||'Artículo',c?.category||'')}}});
document.getElementById('modal').addEventListener('submit',e=>{e.preventDefault();let f=e.target,d=Object.fromEntries(new FormData(f).entries());if(f.id==='genericItemForm'){let target=window.masterTarget;if(target?.item){Object.assign(target.item,{name:d.name,qty:Math.max(1,Number(d.qty)||1),note:d.note||''})}else{let cat=db.master.find(c=>c.id===target?.catId)||db.master[0];if(!cat){cat={id:uid(),category:'Otros',icon:'🧳',items:[]};db.master.push(cat)}cat.items.push({id:uid(),name:d.name,qty:Math.max(1,Number(d.qty)||1),note:d.note||'',done:false})}save();closeModal();render();toast('Lista maestra actualizada')}else if(f.id==='catForm'){let t=currentTrip(),existingCat=false;if(t){let cat=t.categories.find(c=>c.id===activeCategory);if(cat){cat.category=d.category;cat.icon=d.icon||'🧳';existingCat=true}else t.categories.push({id:uid(),category:d.category,icon:d.icon||'🧳',items:[]})}save();closeModal();go(existingCat?'category':'categories')}else if(f.id==='masterCatForm'){db.master.push({id:uid(),category:d.category,icon:d.icon||'🧳',items:[]});save();closeModal();render()}else if(f.id==='renameCatForm'){let c=db.master.find(c=>c.id===window.renameCat);if(c)c.category=d.category;save();closeModal();render()}});
document.addEventListener('change',async e=>{if(e.target.id!=='importFile')return;let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!d.trips||!d.master||!d.settings)throw new Error('Formato');if(confirm('¿Reemplazar los datos actuales por esta copia?')){db=d;save();go('trips');toast('Copia restaurada')}}catch(err){toast('El archivo no es una copia válida de Mi Maleta')}e.target.value=''});
